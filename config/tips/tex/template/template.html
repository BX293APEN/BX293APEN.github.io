<div id="tex-app" class="py-3">
    <h1 class="h4 mb-3">__TITLE__</h1>

    <div class="row g-2 mb-2">
        <div class="col-md-6">
            <input id="tex-q" type="search" class="form-control" placeholder="キーワード検索(大文字・小文字・全角半角を区別しません / 空白区切りでAND)">
        </div>
        <div class="col-md-6 d-flex align-items-center gap-2">
            <span id="tex-count" class="small text-body-secondary"></span>
            <button id="tex-clear" type="button" class="btn btn-sm btn-outline-secondary">絞り込みを解除</button>
        </div>
    </div>

    <div class="mb-2 pb-4">
        __FILTERS__
    </div>

    __NOTES__

    <div class="scroller">
        <table class="table-nostriped">
            <thead>
                <tr class="r1">
                    <th class="name">説明</th>
                    <th>書き方</th><th>数式</th><th>備考</th>
                </tr>
            </thead>
            <tbody>
__ROWS__
            </tbody>
        </table>
    </div>
</div>
