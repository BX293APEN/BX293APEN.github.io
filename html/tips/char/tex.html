<!DOCTYPE html>
<html lang="ja" data-bs-theme="auto">
    <head>
        <meta charset="UTF-8">
        <meta name="google-site-verification" content="OC87FYYbTNU7c3Q1vn3qee5kXLtXMjotpx0iGK1ZPUU" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <meta property="og:title" content="LaTeX" />
        <meta property="og:url" content="https://bx293apen.github.io/" />
        <meta property="og:image" content="https://bx293apen.github.io/img/PEN.png" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="とあるペンギンの実験室" />
        <meta property="og:description" content="LaTeX 書き方一覧" />
        <meta name="theme-color" content="#FF0000" />
        
        <script src="/model/tips/tips.js"></script>
        <script src="/model/index/index.js"></script>
        <script src="/model/tips/ascii.js"></script>
        
        <div id="styleList"></div>
        <link href="/css/loading.css" rel="stylesheet">
        <link href="/css/tips/tex_source.css" rel="stylesheet">
        <div class="loading-container" id="loadingScreen">
            <div class="loading"></div>
        </div>
        <script src="/view/loading.js"></script>
        <title>LaTeX</title>
    </head>
    <body>
        <div id="header-contents"></div>
        <div class ="mx-1 g-5 pt-4 ps-4">
            <main>
                <div class = "row">
                    <div class ="col-md-8 pt-4">
                        <article class="blog-post">
                            <h2 class="pt-4 mt-4 border-bottom fw-bold">
                                LaTeX 数式入力
                            </h2>
                            <div class="row featurette">
                                <div class="col-md-7 order-md-2">
                                    <textarea id="texSource" rows = "12">
\begin{equation} x^{2} \end{equation}
                                    </textarea>
                        
                                </div>
                    
                                <div class="col-md-5 order-md-1">
                                    <div class="bd-placeholder-img bd-placeholder-img-lg featurette-image img-fluid mx-auto" width="500" height="500" preserveAspectRatio="xMidYMid slice" focusable="false">
                                        <div id="texPlace"></div>
                                    </div>
                                </div>
                            </div>
                        </article>
                        <article class="blog-post">
                            <div id="tex"></div>
                        </article>
                        
                    </div>

                    <div class="col-md-4">
                        <div class="position-sticky" style="top: 2rem;">
                            <div class="p-4 text-nowrap">
                                <h4 class="fst-italic border-bottom">References</h4>
                                <ol class="list-unstyled mb-0">
                                    <li>
                                        <a href="https://qiita.com/PlanetMeron/items/63ac58898541cbe81ada">Qiitaの数式チートシート</a>
                                    </li>
    
                                </ol>
                                <!--
                                <h4 class="fst-italic border-bottom">Table of Contents</h4>
                                <div id = "toc"></div>
                                -->
                            </div>
                            <div id="tips"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        
    </body>
    <footer class="container border-top"> <!-- FOOTER -->
        <div id="pagination"></div>
        <div id="footer-contents"></div>
        <script src="/view/bootstrap.bundle.min.js"></script>
        <script src="/view/search.js"></script>
        <script src="/view/embeddedHTML.js"></script>
        <script src="/view/highlight.min.js"></script>
        <script src="/view/activenav.js"></script>
        <script src="/view/tips/tips.js"></script>
        <script src="/view/md.js"></script>
        <script src="/view/pagination.js"></script>
        <script src="/view/Tex2Math.js"></script>
        <script src="/view/createTable.js"></script>
        <script>
            embedded_html("/template/styleConfig.html", "styleList");
            embedded_html("/template/header.html", "header-contents");
            embedded_html("/template/footer.html", "footer-contents");
            window.addEventListener("load", active_nav("tipsIndex"));
            hljs.highlightAll();

            embedded_html("/html/tips/char/tex_source.html", "tex");

            new TipsView(tipsModel, "tips", "tips", ["linuxTip", "serverTip", "rn4020Tip"]);
            new Pagination(2, asciiModel.page, "pagination");

            window.addEventListener(
                'load',
                () => {
                    setTimeout(
                        () => {
                            createTableSearch(
                                    {
                                    appId: 'tex-app',
                                    inputId: 'tex-q',
                                    countId: 'tex-count',
                                    clearId: 'tex-clear',
                                    scrollerSelector: '.scroller',
                                    headRowSelector: 'thead tr.r1',
                                    rowSelector: 'tbody tr[data-tags]',
                                    tagAttr: 'data-tag',
                                    rowTagsAttr: 'data-tags',
                                }
                            );
                        },
                        300
                    );
                }
            );

            window.addEventListener(
                'load',
                () => {
                    setTimeout(
                        () => {
                            new TexText2Math(
                                { 
                                    texPlace: "texPlace", 
                                    texSource: "texSource", 
                                    src: "/view/tex.js",
                                }
                            );
                            new Tex2Math("texClass", "/view/tex.js");
                            
                        },
                        300
                    );
                }
            );

        </script>
    </footer>
</html>
